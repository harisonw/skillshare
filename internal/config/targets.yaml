targets:
  - name: adal
    skills:
      global: "~/.adal/skills"
      project: ".adal/skills"
  - name: universal
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
    aliases: [agents]
  - name: amp
    skills:
      global: "~/.config/agents/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.agents/skills", "~/.config/amp/skills", "~/.claude/skills"]
      project: [".claude/skills"]
    instructions:
      global: "~/.config/amp/AGENTS.md"
      project: "AGENTS.md"
  - name: antigravity
    skills:
      global: "~/.gemini/config/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.agents/skills"]
    # Same global file as gemini, so it always shares gemini's instructions.
    instructions:
      global: "~/.gemini/GEMINI.md"
      project: "AGENTS.md"
      same_as: gemini
  - name: antigravity-cli
    skills:
      global: "~/.gemini/antigravity-cli/skills"
      project: ".agents/skills"
  - name: aiderdesk
    skills:
      global: "~/.aider-desk/skills"
      project: ".aider-desk/skills"
    aliases: [aider-desk]
  - name: astrbot
    skills:
      global: "~/.astrbot/data/skills"
      project: "data/skills"
  - name: augment
    skills:
      global: "~/.augment/skills"
      project: ".augment/skills"
    agents:
      global: "~/.augment/agents"
      project: ".augment/agents"
  - name: bob
    skills:
      global: "~/.bob/skills"
      project: ".bob/skills"
  - name: claude
    config_dir: "~/.claude"
    skills:
      global: "~/.claude/skills"
      project: ".claude/skills"
    agents:
      global: "~/.claude/agents"
      project: ".claude/agents"
    # Claude reads ./AGENTS.md only when the project has no CLAUDE.md, and has
    # no user-level AGENTS.md. Rules are the extra .md files it loads too.
    instructions:
      global: "~/.claude/CLAUDE.md"
      project: "CLAUDE.md"
      import: true
      project_fallback: "AGENTS.md"
      rules:
        global: "~/.claude/rules"
        project: ".claude/rules"
    aliases: [claude-code]
  - name: codearts
    skills:
      global: "~/.codeartsdoer/skills"
      project: ".codeartsdoer/skills"
    aliases: [codearts-agent]
  - name: cline
    skills:
      global: "~/.cline/skills"
      project: ".cline/skills"
    also_scans:
      project: [".clinerules/skills", ".claude/skills"]
  - name: codebuddy
    skills:
      global: "~/.codebuddy/skills"
      project: ".codebuddy/skills"
  - name: codestudio
    skills:
      global: "~/.codestudio/skills"
      project: ".codestudio/skills"
    aliases: [code-studio]
  - name: comate
    skills:
      global: "~/.comate/skills"
      project: ".comate/skills"
  - name: codex
    detect: "~/.codex"
    config_dir: "~/.codex"
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.codex/skills"]
      project: [".codex/skills"]
    instructions:
      global: "~/.codex/AGENTS.md"
      project: "AGENTS.md"
  - name: commandcode
    skills:
      global: "~/.commandcode/skills"
      project: ".commandcode/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
    aliases: [command-code]
  - name: continue
    skills:
      global: "~/.continue/skills"
      project: ".continue/skills"
  - name: cortex
    skills:
      global: "~/.snowflake/cortex/skills"
      project: ".cortex/skills"
  - name: copilot
    skills:
      global: "~/.copilot/skills"
      project: ".github/skills"
    agents:
      global: "~/.copilot/agents"
      project: ".github/agents"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".claude/skills", ".agents/skills"]
    aliases: [github-copilot]
  - name: crush
    skills:
      global: "~/.config/crush/skills"
      project: ".crush/skills"
    also_scans:
      global: ["~/.config/agents/skills", "~/.agents/skills", "~/.claude/skills"]
      project: [".agents/skills", ".claude/skills", ".cursor/skills"]
  - name: cursor
    skills:
      global: "~/.cursor/skills"
      project: ".agents/skills"
    agents:
      global: "~/.cursor/agents"
      project: ".cursor/agents"
    also_scans:
      global: ["~/.agents/skills", "~/.claude/skills", "~/.codex/skills"]
      project: [".cursor/skills", ".claude/skills", ".codex/skills"]
    # Cursor keeps User Rules in app settings, so there is no global file.
    instructions:
      project: "AGENTS.md"
  - name: deepagents
    skills:
      global: "~/.deepagents/agent/skills"
      project: ".deepagents/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
    aliases: [deep-agents]
  - name: devin
    skills:
      global: "~/.config/devin/skills"
      project: ".devin/skills"
    aliases: [devin-terminal]
  - name: dexto
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
  - name: droid
    skills:
      global: "~/.factory/skills"
      project: ".factory/skills"
    agents:
      global: "~/.factory/droids"
      project: ".factory/droids"
    also_scans:
      global: ["~/.agents/skills", "~/.agent/skills"]
      project: [".agents/skills", ".agent/skills"]
    aliases: [factory]
  - name: firebender
    skills:
      global: "~/.firebender/skills"
      project: ".firebender/skills"
    also_scans:
      global: ["~/.agents/skills", "~/.claude/skills", "~/.codex/skills", "~/.cursor/skills", "~/.goose/skills"]
  - name: forgecode
    skills:
      global: "~/forge/skills"
      project: ".forge/skills"
    aliases: [forge-code]
  - name: gemini
    skills:
      global: "~/.gemini/skills"
      project: ".gemini/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
    # Gemini CLI's @import only reads allowed directories; unverified for skillshare paths, so symlink for now.
    instructions:
      global: "~/.gemini/GEMINI.md"
      project: "GEMINI.md"
    aliases: [gemini-cli]
  - name: goose
    detect: "~/.config/goose"
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.config/goose/skills", "~/.claude/skills", "~/.config/agents/skills"]
      project: [".goose/skills", ".claude/skills"]
    instructions:
      global: "~/.config/goose/.goosehints"
      project: "AGENTS.md"
  - name: grok
    skills:
      global: "~/.grok/skills"
      project: ".grok/skills"
    also_scans:
      global: ["~/.agents/skills"]
    aliases: [xai, grok-cli]
  - name: hermes
    skills:
      global: "~/.hermes/skills"
      project: ".hermes/skills"
    aliases: [hermes-agent]
  - name: iflow
    skills:
      global: "~/.iflow/skills"
      project: ".iflow/skills"
    aliases: [iflow-cli]
  - name: junie
    skills:
      global: "~/.junie/skills"
      project: ".junie/skills"
  - name: kilocode
    skills:
      global: "~/.kilo/skills"
      project: ".kilo/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
    aliases: [kilo]
  - name: kimi
    skills:
      global: "~/.config/agents/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.kimi/skills", "~/.claude/skills", "~/.codex/skills"]
      project: [".kimi/skills", ".claude/skills", ".codex/skills"]
    aliases: [kimi-cli]
  - name: kiro
    skills:
      global: "~/.kiro/skills"
      project: ".kiro/skills"
    instructions:
      global: "~/.kiro/steering/AGENTS.md"
      project: "AGENTS.md"
    aliases: [kiro-cli]
  - name: kode
    skills:
      global: "~/.kode/skills"
      project: ".kode/skills"
    also_scans:
      project: [".claude/skills"]
  - name: letta
    skills:
      global: "~/.letta/skills"
      project: ".skills"
  - name: lingma
    skills:
      global: "~/.lingma/skills"
      project: ".lingma/skills"
  - name: mcpjam
    skills:
      global: "~/.mcpjam/skills"
      project: ".mcpjam/skills"
  - name: mux
    skills:
      global: "~/.mux/skills"
      project: ".mux/skills"
  - name: neovate
    skills:
      global: "~/.neovate/skills"
      project: ".neovate/skills"
  - name: omp
    skills:
      global: "~/.omp/agent/skills"
      project: ".omp/skills"
    aliases: [oh-my-pi]
  - name: openclaw
    skills:
      global: "~/.openclaw/skills"
      project: "skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
  - name: opencode
    skills:
      global: "~/.config/opencode/skills"
      project: ".opencode/skills"
    agents:
      global: "~/.config/opencode/agents"
      project: ".opencode/agents"
    also_scans:
      global: ["~/.claude/skills", "~/.agents/skills"]
      project: [".claude/skills", ".agents/skills"]
    instructions:
      global: "~/.config/opencode/AGENTS.md"
      project: "AGENTS.md"
  - name: openhands
    detect: "~/.openhands"
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
    also_scans:
      global: ["~/.openhands/skills"]
      project: [".openhands/skills"]
  - name: pi
    config_dir: "~/.pi/agent"
    skills:
      global: "~/.pi/agent/skills"
      project: ".pi/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
  - name: pochi
    skills:
      global: "~/.pochi/skills"
      project: ".pochi/skills"
  - name: purecode
    skills:
      global: "~/.purecode/skills"
      project: ".agents/skills"
    aliases: [purecode-ai]
  - name: qoder
    skills:
      global: "~/.qoder/skills"
      project: ".qoder/skills"
  - name: qwen
    skills:
      global: "~/.qwen/skills"
      project: ".qwen/skills"
    aliases: [qwen-code]
  - name: roo
    skills:
      global: "~/.roo/skills"
      project: ".roo/skills"
    also_scans:
      global: ["~/.agents/skills"]
      project: [".agents/skills"]
    instructions:
      global: "~/.roo/rules/AGENTS.md"
      project: "AGENTS.md"
  - name: rovodev
    skills:
      global: "~/.rovodev/skills"
      project: ".rovodev/skills"
    aliases: [rovo-dev]
  - name: tabnine
    skills:
      global: "~/.tabnine/agent/skills"
      project: ".tabnine/agent/skills"
    aliases: [tabnine-cli]
  - name: trae
    skills:
      global: "~/.trae/skills"
      project: ".trae/skills"
  - name: trae-cn
    skills:
      global: "~/.trae-cn/skills"
      project: ".trae/skills"
  - name: vibe
    skills:
      global: "~/.vibe/skills"
      project: ".vibe/skills"
    aliases: [mistral-vibe]
  - name: verdent
    skills:
      global: "~/.verdent/skills"
      project: ".verdent/skills"
  - name: warp
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
  - name: windsurf
    skills:
      global: "~/.codeium/windsurf/skills"
      project: ".windsurf/skills"
    # Windsurf caps global rules at 6,000 characters.
    instructions:
      global: "~/.codeium/windsurf/memories/global_rules.md"
      project: "AGENTS.md"
      max_chars: 6000
  - name: witsy
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
  - name: xcode-claude
    skills:
      global: "~/Library/Developer/Xcode/CodingAssistant/ClaudeAgentConfig/skills"
      project: ".claude/skills"
  - name: xcode-codex
    skills:
      global: "~/Library/Developer/Xcode/CodingAssistant/codex/skills"
      project: ".codex/skills"
  - name: zed
    skills:
      global: "~/.agents/skills"
      project: ".agents/skills"
  - name: zencoder
    skills:
      global: "~/.zencoder/skills"
      project: ".zencoder/skills"
  - name: replit
    skills:
      global: "~/.config/agents/skills"
      project: ".agents/skills"
